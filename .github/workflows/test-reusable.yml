name: Reusable workflow caller
on:
  push:

jobs:
  call-workflow:
    uses: ./.github/workflows/test-reusable-callee.yml

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [ call-workflow ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test.txt
      - run: cat test.txt
