name: Output test
on:
  push:
    branches: [ '🙄' ]

jobs:
  writer:
    runs-on: ubuntu-latest
    outputs:
      a: ${{ case( job.status != 'success', job.status, 'ok' ) }}
      b: ${{ case( job.status != 'success', job.status, '' ) }}

    steps:
      - run: |
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            exit 1
          fi

  reader:
    runs-on: ubuntu-latest
    needs: writer
    if: ${{ ! cancelled() }}
    steps:
      - name: output
        env:
          A: ${{ needs.writer.outputs.a }}
          B: ${{ needs.writer.outputs.b }}
        run: |
          echo "A=$A B=$B"
