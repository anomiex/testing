name: Test label event
on:
  pull_request:
    types: [ labeled, unlabeled ]
  workflow_dispatch:

jobs:
  job:
    name: Job
    runs-on: ubuntu-latest
    steps:
      - name: Info
        env:
          EVENT: ${{ toJson( github ) }}
        run: jq . <<<"$EVENT"
      - name: Skip
        if: false
        id: a-step
        run: echo "FOO=bar" >> "$GITHUB_OUTPUT"
      - env:
          FOO: ${{ steps.a-step.outputs.FOO }}
        run: echo "FOO=$FOO"
