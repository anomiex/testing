name: Merge group test
on:
  pull_request:
  merge_group:

jobs:
  test1:
    name: Test 1
    runs-on: ubuntu-latest
    steps:
      - run: true

  test2:
    name: Test 2
    runs-on: ubuntu-latest
    steps:
      - run: true

  test3:
    name: Foo less than 100
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ $(< foo.txt ) -lt 100 ]]; then
            echo "ok"
          else
            echo "bad"
            exit 1
          fi

  test4:
    name: Foo greater than 0
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ $(< foo.txt ) -gt 0 ]]; then
            echo "ok"
          else
            echo "bad"
            exit 1
          fi
